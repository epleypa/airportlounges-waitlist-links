name: Validate Pull Request

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Schema and ID Validation
        run: npm run validate

      - name: Verify README & Artifacts are in sync
        run: |
          npm run build
          if [ -n "$(git status --porcelain README.md data/lounges.json)" ]; then
            echo "❌ Error: README.md or data/lounges.json is out of sync with the build output."
            echo "Please run 'npm run build' locally, commit the changes, and push again."
            git diff
            exit 1
          fi
          echo "✅ All data and generated tables are in sync!"
